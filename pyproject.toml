[project]
name = "devenv-skills"
version = "0.2.0"
description = "Dev-environment Claude Code skills — setup/repair/upgrade/optimize helpers, in Python."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "John Plantada" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "FURB", "RUF"]
# E741: single-letter loop/comprehension vars (`l`) are idiomatic here and this rule
# is widely disabled; not worth churny renames.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Skill helpers legitimately (a) insert the repo root on sys.path before importing
# lib.devenv_common (E402) and (b) re-export those primitives for their sibling
# scripts (F401). Both are by design, not smells.
"skills/**/scripts/_*.py" = ["E402", "F401"]
