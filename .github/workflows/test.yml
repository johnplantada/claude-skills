name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Same entry point contributors run locally (`./check`), so a green laptop means a
  # green CI — no separate incantation to keep in sync.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install -r requirements-dev.txt
      - name: Lint + unit tests
        run: ./check

  # The unit suite exercises pure functions with canned tool output; this job runs
  # every read-only entry point end to end on the OS the skills target, catching
  # subprocess-wrapper rot and real-tool output-format drift.
  smoke-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install -r requirements-dev.txt
      - name: Lint + unit + smoke
        run: ./check --smoke
