name: tests

on:
  push:
  pull_request:

jobs:
  # Same entry point contributors run locally (`./check`), so a green laptop means a
  # green CI — no separate incantation to keep in sync.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install pytest ruff
      - name: Lint + unit tests
        run: ./check

  # The unit suite exercises pure functions with canned tool output; this job runs
  # every read-only entry point end to end on the OS the skills target, catching
  # subprocess-wrapper rot and real-tool output-format drift.
  smoke-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install pytest ruff
      - name: Lint + unit + smoke
        run: ./check --smoke
